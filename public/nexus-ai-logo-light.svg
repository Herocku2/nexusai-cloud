<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Versión clara para fondos oscuros -->
  <defs>
    <linearGradient id="bgGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:0.95" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo claro -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradientLight)"/>
  
  <!-- Nodos del network -->
  <g opacity="0.3">
    <circle cx="100" cy="50" r="4" fill="#3B82F6"/>
    <circle cx="70" cy="80" r="4" fill="#3B82F6"/>
    <circle cx="130" cy="80" r="4" fill="#3B82F6"/>
    <circle cx="50" cy="120" r="4" fill="#3B82F6"/>
    <circle cx="100" cy="120" r="4" fill="#3B82F6"/>
    <circle cx="150" cy="120" r="4" fill="#3B82F6"/>
    <circle cx="70" cy="150" r="4" fill="#3B82F6"/>
    <circle cx="130" cy="150" r="4" fill="#3B82F6"/>
    
    <!-- Líneas de conexión -->
    <line x1="100" y1="50" x2="70" y2="80" stroke="#3B82F6" stroke-width="1"/>
    <line x1="100" y1="50" x2="130" y2="80" stroke="#3B82F6" stroke-width="1"/>
    <line x1="70" y1="80" x2="50" y2="120" stroke="#3B82F6" stroke-width="1"/>
    <line x1="70" y1="80" x2="100" y2="120" stroke="#3B82F6" stroke-width="1"/>
    <line x1="130" y1="80" x2="100" y2="120" stroke="#3B82F6" stroke-width="1"/>
    <line x1="130" y1="80" x2="150" y2="120" stroke="#3B82F6" stroke-width="1"/>
    <line x1="50" y1="120" x2="70" y2="150" stroke="#3B82F6" stroke-width="1"/>
    <line x1="100" y1="120" x2="70" y2="150" stroke="#3B82F6" stroke-width="1"/>
    <line x1="100" y1="120" x2="130" y2="150" stroke="#3B82F6" stroke-width="1"/>
    <line x1="150" y1="120" x2="130" y2="150" stroke="#3B82F6" stroke-width="1"/>
  </g>
  
  <!-- Letra "N" en azul -->
  <path d="M 60 75 L 60 125 L 70 125 L 70 95 L 110 125 L 120 125 L 120 75 L 110 75 L 110 105 L 70 75 Z" fill="#3B82F6"/>
  
  <!-- Puntos de IA -->
  <circle cx="135" cy="85" r="8" fill="#3B82F6"/>
  <circle cx="135" cy="105" r="6" fill="#8B5CF6" opacity="0.7"/>
  <circle cx="135" cy="120" r="4" fill="#8B5CF6" opacity="0.5"/>
  
  <!-- Texto "AI" -->
  <text x="128" y="92" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">AI</text>
</svg>
