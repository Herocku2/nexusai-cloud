<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular con gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)"/>
  
  <!-- Nodos del network (puntos conectados) -->
  <g opacity="0.3">
    <circle cx="100" cy="50" r="4" fill="white"/>
    <circle cx="70" cy="80" r="4" fill="white"/>
    <circle cx="130" cy="80" r="4" fill="white"/>
    <circle cx="50" cy="120" r="4" fill="white"/>
    <circle cx="100" cy="120" r="4" fill="white"/>
    <circle cx="150" cy="120" r="4" fill="white"/>
    <circle cx="70" cy="150" r="4" fill="white"/>
    <circle cx="130" cy="150" r="4" fill="white"/>
    
    <!-- Líneas de conexión -->
    <line x1="100" y1="50" x2="70" y2="80" stroke="white" stroke-width="1"/>
    <line x1="100" y1="50" x2="130" y2="80" stroke="white" stroke-width="1"/>
    <line x1="70" y1="80" x2="50" y2="120" stroke="white" stroke-width="1"/>
    <line x1="70" y1="80" x2="100" y2="120" stroke="white" stroke-width="1"/>
    <line x1="130" y1="80" x2="100" y2="120" stroke="white" stroke-width="1"/>
    <line x1="130" y1="80" x2="150" y2="120" stroke="white" stroke-width="1"/>
    <line x1="50" y1="120" x2="70" y2="150" stroke="white" stroke-width="1"/>
    <line x1="100" y1="120" x2="70" y2="150" stroke="white" stroke-width="1"/>
    <line x1="100" y1="120" x2="130" y2="150" stroke="white" stroke-width="1"/>
    <line x1="150" y1="120" x2="130" y2="150" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Letra "N" estilizada -->
  <path d="M 60 75 L 60 125 L 70 125 L 70 95 L 110 125 L 120 125 L 120 75 L 110 75 L 110 105 L 70 75 Z" fill="white"/>
  
  <!-- Puntos de IA (representa circuito neuronal) -->
  <circle cx="135" cy="85" r="8" fill="white"/>
  <circle cx="135" cy="105" r="6" fill="white" opacity="0.7"/>
  <circle cx="135" cy="120" r="4" fill="white" opacity="0.5"/>
  
  <!-- Texto "AI" pequeño -->
  <text x="128" y="92" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3B82F6">AI</text>
</svg>
